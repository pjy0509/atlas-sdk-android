// atlas-core: the transport half every module rides. Pure Java 7 syntax, no
// dependencies, minSdk 16 — the floor is the product (the server repo's docs/sdk-cautions.md §2).
apply plugin: 'com.android.library'

android {
    namespace 'dev.appatlas.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 16
        consumerProguardFiles 'consumer-rules.pro'
    }

    // The sources stay Java 7 syntax — that is what an old toolchain needs —
    // but modern JDKs refuse to compile against level 7, so the target is 8.
    // Nothing here uses a Java 8 language feature, so nothing is desugared.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

ext.moduleDescription = 'The transport half of the App Atlas SDK: envelopes, the disk queue and the sender.'

apply from: rootProject.file('gradle/publishing.gradle')
