// The coordinates every module publishes under; the publishing itself is in
// gradle/publishing.gradle, applied from each module so its afterEvaluate
// queues behind the Android plugin's.
plugins {
    id 'com.android.library' version '8.5.2' apply false
}

subprojects {
    group = 'dev.appatlas'
    version = '0.1.0'
}
