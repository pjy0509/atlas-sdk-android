// Publishing lives here so both modules are released the same way; only the
// artifactId and description differ. Credentials come from the environment or
// ~/.gradle/gradle.properties, never this repo.
plugins {
    id 'com.android.library' version '8.5.2' apply false
}

subprojects {
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    group = 'dev.appatlas'
    version = '0.1.0'

    afterEvaluate {
        publishing {
            publications {
                release(MavenPublication) {
                    from components.release
                    artifactId = project.name

                    pom {
                        name = project.name
                        description = project.findProperty('moduleDescription') ?: 'App Atlas SDK'
                        url = 'https://appatlas.dev'

                        licenses {
                            license {
                                name = 'MIT License'
                                url = 'https://opensource.org/licenses/MIT'
                            }
                        }

                        developers {
                            developer {
                                id = 'pjy0509'
                                name = 'Park Jungyoung'
                                email = 'qkrwnss0509@gmail.com'
                            }
                        }

                        scm {
                            url = 'https://github.com/pjy0509/atlas-sdk-android'
                            connection = 'scm:git:https://github.com/pjy0509/atlas-sdk-android.git'
                            developerConnection = 'scm:git:ssh://git@github.com/pjy0509/atlas-sdk-android.git'
                        }
                    }
                }
            }

            repositories {
                maven {
                    name = 'central'
                    url = version.toString().endsWith('SNAPSHOT')
                            ? 'https://central.sonatype.com/repository/maven-snapshots/'
                            : 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'

                    credentials {
                        username = findProperty('centralUsername') ?: System.getenv('CENTRAL_USERNAME')
                        password = findProperty('centralPassword') ?: System.getenv('CENTRAL_PASSWORD')
                    }
                }
            }
        }

        signing {
            // In-memory keys so CI never writes a keyring to disk; a local
            // build without them simply publishes unsigned to mavenLocal.
            def key = findProperty('signingInMemoryKey') ?: System.getenv('SIGNING_KEY')
            def password = findProperty('signingInMemoryKeyPassword') ?: System.getenv('SIGNING_PASSWORD')

            if (key) {
                useInMemoryPgpKeys(key.toString(), password?.toString() ?: '')
                sign publishing.publications.release
            }
        }
    }
}
