// atlas-links: deferred deep links off the install referrer, direct opens off
// the activity intent. The referrer library is compileOnly on purpose — an
// app built without it loses only the deferred path (ReferrerFetcher guards
// the absence), the way Adjust keeps store clients optional.
apply plugin: 'com.android.library'

android {
    namespace 'dev.appatlas.sdk.links'
    compileSdk 34

    defaultConfig {
        minSdk 16
        consumerProguardFiles 'consumer-rules.pro'
    }

    // The sources stay Java 7 syntax — that is what an old toolchain needs —
    // but modern JDKs refuse to compile against level 7, so the target is 8.
    // Nothing here uses a Java 8 language feature, so nothing is desugared.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    api project(':atlas-core')
    compileOnly 'com.android.installreferrer:installreferrer:2.2'
}

ext.moduleDescription = 'Deep-link inflow for the App Atlas SDK: deferred links off the install referrer, direct opens off the intent.'

apply from: rootProject.file('gradle/publishing.gradle')
