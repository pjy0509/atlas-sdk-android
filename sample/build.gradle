// The Android sample: the integration test and the documentation's code
// source. Every way an app can die is one intent extra away, so a device run
// can exercise each capture path and pull the envelopes it left behind.
apply plugin: 'com.android.application'

android {
    namespace 'dev.appatlas.sample'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.appatlas.sample'
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName '0.7.0'
        // A fixed id here; a real app mints one per build (README).
        manifestPlaceholders.atlasMappingId = 'sample-build-0007'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // Keep the native library unstripped in the APK: the device run uploads
    // this very .so as the ELF debug file to prove symbolication.
    packagingOptions {
        jniLibs {
            keepDebugSymbols += '**/libboom.so'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':atlas-crash')
    implementation project(':atlas-crash-ndk')
    implementation project(':atlas-links')
}
